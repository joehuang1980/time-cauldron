<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Time Cauldron</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --wizard-gold: #fbbf24;
            --wizard-maroon: #7f1d1d;
            --paper-bg: #f5f0e1;
            --liquid-color: rgba(251, 191, 36, 0.3); /* Default Ambient Gold */
        }
        body {
            font-family: 'Georgia', serif;
            background-color: var(--paper-bg);
            color: #2d1e10;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            font-size: 18px;
        }
        
        .app-container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        h1 {
            color: var(--wizard-maroon);
            letter-spacing: 2px;
            font-size: 36px;
            margin: 0 0 5px 0;
            text-align: center;
        }
        .subtitle { font-style: italic; font-size: 16px; margin-bottom: 25px; color: #555; }
        
        /* Profile Selector */
        .profile-card {
            background: #7f1d1d; color: #fff; border-radius: 35px; padding: 12px 25px;
            width: 100%; max-width: 380px; margin-bottom: 25px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15); box-sizing: border-box;
        }
        .profile-label { font-weight: bold; font-size: 16px; letter-spacing: 1px; }
        .profile-select {
            background: var(--wizard-gold); color: #7f1d1d; font-weight: bold; border: none;
            padding: 8px 20px; border-radius: 20px; font-size: 16px; width: auto; cursor: pointer;
        }

        /* 🧙‍♂️ Magic Powder Particle Effect */
        .magic-powder {
            position: absolute;
            width: 20px; height: 20px;
            border-radius: 50%;
            top: 100px;
            opacity: 0;
            z-index: 10;
            pointer-events: none;
            filter: blur(2px);
            box-shadow: 0 0 15px currentColor;
        }
        @keyframes dropPowder {
            0% { top: 80px; opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.2); }
            80% { opacity: 1; transform: scale(1); }
            100% { top: 220px; opacity: 0; transform: scale(0.2); }
        }

        /* ⚗️ Cauldron with Animated Liquid Inside */
        .cauldron-container {
            width: 220px; height: 220px;
            background: radial-gradient(circle at 30% 30%, #374151, #111827);
            border-radius: 60px 60px 110px 110px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
            position: relative;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 5px solid #1f2937; margin-bottom: 35px;
            overflow: hidden; /* Keeps liquid inside */
        }
        .cauldron-container::before {
            content: ''; position: absolute; top: -2px; width: 210px; height: 20px; 
            background: #1f2937; border-radius: 50%; z-index: 4;
        }
        
        /* 🧪 Animated Magic Liquid */
        .cauldron-liquid {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            height: 65%; /* Liquid fill level */
            background-color: var(--liquid-color);
            z-index: 1;
            transition: background-color 0.8s ease, height 1s ease;
            box-shadow: inset 0 10px 20px rgba(255,255,255,0.2);
            animation: liquidBreathe 4s ease-in-out infinite;
        }
        
        @keyframes liquidBreathe {
            0%, 100% { height: 63%; filter: brightness(1); }
            50% { height: 67%; filter: brightness(1.2); }
        }
        
        /* Magic Flash and Shake Animations */
        .shake { animation: cauldronShake 0.5s linear infinite; }
        @keyframes cauldronShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px) rotate(-1deg); }
            75% { transform: translateX(4px) rotate(1deg); }
        }

        .balance-num { 
            font-size: 70px; font-weight: bold; color: var(--wizard-gold); 
            z-index: 3; text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        .balance-label { color: #fff; font-size: 12px; font-weight: bold; z-index: 3; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
        
        /* iPad Responsive Grid System */
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 25px; width: 100%; margin-bottom: 20px; }
        @media (min-width: 650px) { .grid-container { grid-template-columns: 1fr 1fr; } }

        .section-card {
            background: #fff; border: 2px solid #e5e7eb; border-radius: 16px; padding: 22px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.06); box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        h3 { margin-top: 0; color: var(--wizard-maroon); font-size: 22px; margin-bottom: 15px; }
        label { font-size: 15px; font-weight: bold; color: #444; margin-bottom: 4px; display: block; }
        
        select, input, button { width: 100%; padding: 14px; margin: 6px 0 16px 0; border-radius: 10px; border: 1px solid #bbb; font-size: 17px; box-sizing: border-box; }
        button { 
            background-color: var(--wizard-maroon); color: white; border: none; font-weight: bold; cursor: pointer; font-size: 18px; padding: 15px;
            box-shadow: 0 4px 6px rgba(127, 29, 29, 0.2); margin-bottom: 0;
        }
        button:active { background-color: #b91c1c; transform: scale(0.99); }
        .btn-gold { background-color: #b45309; box-shadow: 0 4px 6px rgba(180, 83, 9, 0.2); }
        .btn-gold:active { background-color: #d97706; }
        
        .parent-btn { background: none; color: #777; font-size: 14px; text-decoration: underline; margin-top: 20px; border: none; box-shadow: none; padding: 5px; width: auto;}
        .log-box { background-color: #fefcf6; border: 1px dashed #b45309; border-radius: 8px; padding: 12px; max-height: 250px; overflow-y: auto; font-size: 14px; font-family: monospace; }
        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
        .log-deposit { color: green; font-weight: bold; }
        .log-withdraw { color: red; font-weight: bold; }
        .log-system { color: blue; font-style: italic; }
        .full-width-card { width: 100%; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="magic-powder" id="magicPowder"></div>

        <h1>THE TIME CAULDRON</h1>
        <div class="subtitle">"Your reading turns into magic time!"</div>

        <div class="profile-card">
            <span class="profile-label">🔮 ACTIVE WIZARD:</span>
            <select id="profileSelector" class="profile-select" onchange="changeProfile()">
                <option value="child1">Olivia</option>
                <option value="child2">Lucas</option>
            </select>
        </div>

        <div class="cauldron-container" id="cauldronBody">
            <div class="cauldron-liquid" id="cauldronLiquid"></div>
            <div class="balance-num" id="balanceDisplay">0</div>
            <div class="balance-label">MINUTES LEFT</div>
        </div>

        <div class="grid-container">
            
            <div class="section-card">
                <div>
                    <h3>📜 Pour Reading Time</h3>
                    <label for="bookType">Choose your book type:</label>
                    <select id="bookType">
                        <option value="1.0" data-name="Magazine" data-color="#10b981">Magazine (Rate 1:1) 🟢</option>
                        <option value="1.5" data-name="Chinese Short Book" data-color="#a855f7">Chinese Short Book (Rate 1:1.5) 🟣</option>
                        <option value="1.8" data-name="English Short Book" data-color="#3b82f6">English Short Book (Rate 1:1.8) 🔵</option>
                        <option value="2.0" data-name="English Long Novel" data-color="#fbbf24">English Long Novel (Rate 1:2.0) 🟡</option>
                    </select>
                    <label for="readMins">How many minutes did you read?</label>
                    <input type="number" id="readMins" placeholder="Enter minutes here" min="1">
                </div>
                <button onclick="addTime()">Cast Reading Spell!</button>
            </div>

            <div class="section-card">
                <div>
                    <h3>🔮 Use Video Time</h3>
                    <label for="videoType">What will you watch?</label>
                    <select id="videoType">
                        <option value="LEGO">LEGO Video (Max 45m/day)</option>
                        <option value="Pikmin">Pikmin Guide (Max 25m/day)</option>
                        <option value="Other">Other Videos</option>
                    </select>
                    <label for="watchMins">How many minutes will you watch?</label>
                    <input type="number" id="watchMins" placeholder="Enter minutes here" min="1">
                </div>
                <button class="btn-gold" onclick="useTime()">Open Video Portal</button>
            </div>
            
        </div>

        <div class="section-card full-width-card" id="parentSection" style="display: none;">
            <h3>🔑 Headmaster's Parchment (<span id="logTargetName">Logs</span>)</h3>
            <div class="log-box" id="logContainer"></div>
            <button style="background: #4b5563; margin-top: 15px;" onclick="clearLogs()">Clear Current Logs</button>
            <button style="background: #9ca3af; margin-top: 5px;" onclick="hideParentSection()">Lock Office</button>
        </div>

        <button class="parent-btn" id="openOfficeBtn" onclick="openParentGate()">Parents Desk (Hidden Office)</button>
    </div>

    <script>
        // Database upgraded to V5 to hold new styling architecture
        let state = JSON.parse(localStorage.getItem('wizardTimeBankV5')) || {
            currentActive: "child1",
            profiles: {
                child1: { name: "Olivia", totalMins: 0, legoToday: 0, pikminToday: 0, lastDate: new Date().toDateString(), logs: [] },
                child2: { name: "Lucas", totalMins: 0, legoToday: 0, pikminToday: 0, lastDate: new Date().toDateString(), logs: [] }
            }
        };

        function getTimestamp() {
            let now = new Date();
            return `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        }

        function addLog(text, typeClass) {
            let activeProfile = state.profiles[state.currentActive];
            let timeStr = getTimestamp();
            activeProfile.logs.unshift({ time: timeStr, text: text, type: typeClass });
            if(activeProfile.logs.length > 100) activeProfile.logs.pop();
        }

        function checkDailyReset() {
            let today = new Date().toDateString();
            for (let key in state.profiles) {
                let p = state.profiles[key];
                if (p.lastDate !== today) {
                    p.logs.unshift({
                        time: getTimestamp(),
                        text: `System reset daily limits. (Prev LEGO:${p.legoToday}m, Pikmin:${p.pikminToday}m)`,
                        type: 'log-system'
                    });
                    p.legoToday = 0; p.pikminToday = 0; p.lastDate = today;
                }
            }
            saveData();
        }

        function saveData() {
            localStorage.setItem('wizardTimeBankV5', JSON.stringify(state));
            let activeProfile = state.profiles[state.currentActive];
            document.getElementById('balanceDisplay').innerText = Math.floor(activeProfile.totalMins);
            document.getElementById('logTargetName').innerText = activeProfile.name + " Logs";
            
            // Adjust baseline liquid fill depending on empty or full cauldron
            let liquidEl = document.getElementById('cauldronLiquid');
            if (activeProfile.totalMins <= 0) {
                liquidEl.style.height = "15%"; // Almost empty mud
                document.documentElement.style.setProperty('--liquid-color', 'rgba(100, 100, 100, 0.2)');
            } else {
                liquidEl.style.height = "65%";
            }
            renderLogs();
        }

        function renderLogs() {
            let container = document.getElementById('logContainer');
            let activeProfile = state.profiles[state.currentActive];
            if (!activeProfile.logs || activeProfile.logs.length === 0) {
                container.innerHTML = '<div style="color:#999; text-align:center;">No magic logs yet.</div>';
                return;
            }
            container.innerHTML = activeProfile.logs.map(log => 
                `<div class="log-entry ${log.type}">[${log.time}] ${log.text}</div>`
            ).join('');
        }

        function changeProfile() {
            state.currentActive = document.getElementById('profileSelector').value;
            checkDailyReset();
            saveData();
        }

        // 🟢🟣🔵🟡 Add Time and Trigger Powder/Glow Magic Animation
        function addTime() {
            checkDailyReset();
            let activeProfile = state.profiles[state.currentActive];
            let select = document.getElementById('bookType');
            let rate = parseFloat(select.value);
            let bookName = select.options[select.selectedIndex].getAttribute('data-name');
            let magicColor = select.options[select.selectedIndex].getAttribute('data-color');
            let mins = parseFloat(document.getElementById('readMins').value);
            
            if (!mins || mins <= 0) { alert("Please enter valid minutes!"); return; }

            let earned = mins * rate;
            activeProfile.totalMins += earned;
            addLog(`+ Added ${earned}m (Read ${mins}m of ${bookName})`, 'log-deposit');

            // ANIMATION MAGIC START
            let powder = document.getElementById('magicPowder');
            let liquid = document.getElementById('cauldronLiquid');
            
            // 1. Drop colored powder
            powder.style.color = magicColor;
            powder.style.backgroundColor = magicColor;
            powder.style.animation = 'none';
            powder.offsetHeight; // Trigger reflow to restart animation
            powder.style.animation = 'dropPowder 1.2s ease-in forwards';

            // 2. Change liquid to magic color when powder hits it (after 0.8s)
            setTimeout(() => {
                document.documentElement.style.setProperty('--liquid-color', magicColor + "99"); // Add alpha opacity
                liquid.style.height = "75%"; // Surge up dynamically!
                
                // Return to default warm ambiance after animation finishes
                setTimeout(() => {
                    saveData();
                }, 1500);
            }, 800);

            alert(`🪄 Success! Added ${earned} minutes to ${activeProfile.name}'s cauldron!`);
            document.getElementById('readMins').value = '';
        }

        // 💨 Use Time and Trigger Smoke/Drain Animation
        function useTime() {
            checkDailyReset();
            let activeProfile = state.profiles[state.currentActive];
            let type = document.getElementById('videoType').value;
            let mins = parseFloat(document.getElementById('watchMins').value);
            
            if (!mins || mins <= 0) { alert("Please enter valid minutes!"); return; }
            if (mins > activeProfile.totalMins) { alert("❌ Not enough magic time! Go read some books!"); return; }

            if (type === "LEGO" && (activeProfile.legoToday + mins > 45)) {
                alert(`❌ Too much LEGO today! You can only watch ${45 - activeProfile.legoToday} more minutes.`); return;
            }
            if (type === "Pikmin" && (activeProfile.pikminToday + mins > 25)) {
                alert(`❌ Too much Pikmin today! You can only watch ${25 - activeProfile.pikminToday} more minutes.`); return;
            }

            activeProfile.totalMins -= mins;
            if (type === "LEGO") activeProfile.legoToday += mins;
            if (type === "Pikmin") activeProfile.pikminToday += mins;
            
            addLog(`- Used ${mins}m watching ${type} Video`, 'log-withdraw');

            // ANIMATION FOR WITHDRAWAL START
            let cauldron = document.getElementById('cauldronBody');
            let liquid = document.getElementById('cauldronLiquid');

            // 1. Shake cauldron and turn liquid into vanishing gray smoke
            cauldron.classList.add('shake');
            document.documentElement.style.setProperty('--liquid-color', 'rgba(100, 100, 100, 0.6)'); // Smoke Gray
            liquid.style.height = "20%"; // Instantly drop level

            setTimeout(() => {
                cauldron.classList.remove('shake');
                saveData(); // Final save restores normal level or sets to empty
            }, 1200);

            alert(`🔮 Portal opened! Enjoy your video time, ${activeProfile.name}.`);
            document.getElementById('watchMins').value = '';
        }

        function openParentGate() {
            let password = prompt("[SECURITY VERIFICATION]\nEnter the 16-digit Headmaster Key to view logs:");
            if (password === "1979081219800707") {
                document.getElementById('parentSection').style.display = 'block';
                document.getElementById('openOfficeBtn').style.display = 'none';
                renderLogs();
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } else if (password !== null) {
                alert("💥 Access Denied! Invalid Key.");
            }
        }

        function hideParentSection() {
            document.getElementById('parentSection').style.display = 'none';
            document.getElementById('openOfficeBtn').style.display = 'block';
        }

        function clearLogs() {
            let activeProfile = state.profiles[state.currentActive];
            if(confirm(`Do you want to burn all parchment records for ${activeProfile.name}?`)) {
                activeProfile.logs = [];
                addLog("Parchment cleared by Headmaster.", "log-system");
                saveData();
            }
        }

        document.getElementById('profileSelector').value = state.currentActive;
        checkDailyReset();
        saveData();
    </script>
</body>
</html>
